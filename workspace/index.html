<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <section class="calculator" aria-label="Simple calculator">
        <output id="display" class="display" aria-live="polite">0</output>
        <div class="buttons">
            <!-- Row 1 -->
            <button class="btn" data-key="7" aria-label="Seven">7</button>
            <button class="btn" data-key="8" aria-label="Eight">8</button>
            <button class="btn" data-key="9" aria-label="Nine">9</button>
            <button class="btn operator" data-key="/" aria-label="Divide">÷</button>
            <!-- Row 2 -->
            <button class="btn" data-key="4" aria-label="Four">4</button>
            <button class="btn" data-key="5" aria-label="Five">5</button>
            <button class="btn" data-key="6" aria-label="Six">6</button>
            <button class="btn operator" data-key="*" aria-label="Multiply">×</button>
            <!-- Row 3 -->
            <button class="btn" data-key="1" aria-label="One">1</button>
            <button class="btn" data-key="2" aria-label="Two">2</button>
            <button class="btn" data-key="3" aria-label="Three">3</button>
            <button class="btn operator" data-key="-" aria-label="Subtract">−</button>
            <!-- Row 4 -->
            <button class="btn" data-key="0" aria-label="Zero">0</button>
            <button class="btn" data-key="." aria-label="Decimal point">.</button>
            <button class="btn" id="clear" aria-label="Clear">C</button>
            <button class="btn operator" data-key="+" aria-label="Add">+</button>
            <!-- Row 5 -->
            <button class="btn equal" id="equals" aria-label="Equals" style="grid-column: span 4;">=</button>
        </div>
    </section>
    <script src="app.js"></script>
</body>
</html>
